<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="A path winding through mountains toward a rising sun">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16304F"/>
      <stop offset=".45" stop-color="#3D5F8C"/>
      <stop offset=".72" stop-color="#E9A27A"/>
      <stop offset="1" stop-color="#FFD9A0"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF4CF"/>
      <stop offset=".35" stop-color="#FFD47E" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFB45E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6E86AE"/><stop offset="1" stop-color="#4C668F"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3F5C86"/><stop offset="1" stop-color="#2C4670"/></linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#243F66"/><stop offset="1" stop-color="#16304F"/></linearGradient>
    <linearGradient id="path" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFF4DD"/>
      <stop offset="1" stop-color="#FFE0A6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="140" cy="90" r="2.4" opacity=".8"/><circle cx="260" cy="160" r="1.6" opacity=".6"/>
    <circle cx="420" cy="70" r="2" opacity=".7"/><circle cx="760" cy="110" r="2.2" opacity=".7"/>
    <circle cx="930" cy="60" r="1.8" opacity=".6"/><circle cx="1060" cy="150" r="2.4" opacity=".8"/>
    <circle cx="610" cy="40" r="1.6" opacity=".5"/><circle cx="330" cy="240" r="1.4" opacity=".4"/>
    <circle cx="880" cy="230" r="1.5" opacity=".4"/>
  </g>

  <!-- sun -->
  <circle cx="600" cy="560" r="300" fill="url(#sunglow)"/>
  <circle cx="600" cy="560" r="110" fill="#FFE7A6"/>
  <circle cx="600" cy="560" r="86" fill="#FFF3D1"/>

  <!-- far mountains -->
  <path d="M0 600 L150 470 L260 540 L400 420 L520 520 L600 470 L700 530 L840 400 L980 520 L1080 460 L1200 540 L1200 900 L0 900 Z" fill="url(#m1)"/>
  <!-- mid mountains -->
  <path d="M0 680 L120 590 L240 650 L380 540 L520 660 L640 610 L760 680 L900 560 L1040 650 L1200 590 L1200 900 L0 900 Z" fill="url(#m2)"/>
  <!-- snow caps -->
  <path d="M380 540 L410 566 L392 562 L372 574 L356 560 Z" fill="#E8EEF7" opacity=".9"/>
  <path d="M900 560 L932 588 L912 584 L892 596 L876 580 Z" fill="#E8EEF7" opacity=".9"/>
  <!-- near hills -->
  <path d="M0 760 Q200 690 380 730 T760 720 T1200 700 L1200 900 L0 900 Z" fill="url(#m3)"/>

  <!-- winding path toward the sun -->
  <path d="M520 900 C560 840 700 820 660 780 C620 742 540 748 572 716 C600 690 640 694 612 676 C596 666 590 660 600 652 L606 652 C616 662 626 668 640 678 C672 700 632 708 612 724 C590 742 690 748 720 784 C760 832 640 852 690 900 Z" fill="url(#path)" opacity=".95"/>

  <!-- foreground grass tufts -->
  <g fill="#0F2440">
    <path d="M60 900 L80 840 L96 900 Z"/><path d="M110 900 L124 856 L138 900 Z"/>
    <path d="M1080 900 L1100 836 L1116 900 Z"/><path d="M1130 900 L1144 860 L1158 900 Z"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#1E3A5F" stroke-width="4" stroke-linecap="round" opacity=".7">
    <path d="M820 300 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M880 340 q9 -9 18 0 q9 -9 18 0"/>
  </g>
</svg>
